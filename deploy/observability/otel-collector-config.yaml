# OpenTelemetry Collector configuration for openjiuwen agent_teams.
#
# Pipeline:  application(otlp/grpc) -> memory_limiter -> batch
#                                   -> langfuse
#
# - "debug" exporter (per-span stdout) removed: it is pure noise for a
#   long-running local stack. Re-add to exporters if you need span dumps.
# - Collector's own log level set to error via service.telemetry.logs.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 1024
    spike_limit_mib: 256

  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    tls:
      insecure: true
    headers:
      Authorization: "Basic cGstbGYtaml1d2VuOnNrLWxmLWppdXdlbg=="

service:
  telemetry:
    logs:
      level: error
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/langfuse]

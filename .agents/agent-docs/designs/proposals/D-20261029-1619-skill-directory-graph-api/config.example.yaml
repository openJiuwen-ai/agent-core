# SymphonyRuntime 目标配置草案，当前代码尚未支持此结构。
# 对应设计：D-20261029-1619-skill-directory-graph-api
# 三个必填字段；其余字段展示建议默认值。
# 相对路径在 Runtime 创建时相对进程工作目录解析一次。
capability_root: ./capabilities
capability_type: skill  # skill | expert | connector | mcp；类型值允许使用实际格式名
artifact_root: ./.symphony

retrieval:
  enabled: true
  build:
    max_depth: 6                 # 分类树深度，与文件目录扫描深度无关
    branching_factor: 128        # 每个分类节点的最大分支数
    max_concurrency: 2           # 此次树构建最多并发的模型请求数
    request_timeout_seconds: 420.0  # 单次模型请求超时，不是整个构建的时限
  search:
    top_k: 10                   # 最多返回的候选对象数
    max_parallel_branches: 3    # 单次检索最多并行探索的树分支数
    request_timeout_seconds: 120.0

orchestration:
  enabled: true
  min_edge_confidence: 0.7      # 构图和规划共用的关系置信度阈值
  build:
    extraction_mode: metadata  # metadata | llm；metadata 仅关闭模型语义提取，构图仍会调用模型
    max_concurrency: 1         # 指纹提取、关系解析等阶段共用的单次构图并发上限
    require_consensus: true    # 保留现有两次关系判定的一致性要求
  plan:
    mode: fast                 # fast | beam
    top_k: 3                   # 仅 beam 使用：搜索保留宽度及最多输出的方案数
    max_depth: 4               # 规划展开深度，与分类树深度无关
    dynamic_graph_enabled: false  # 是否在规划时使用已有的图观测结果

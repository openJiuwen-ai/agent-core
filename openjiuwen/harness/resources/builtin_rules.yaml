
# Built-in parameter-level rules for tool_policy (shell guardrails).
#
# 每条规则带默认 action（数据，不是 Engine 映射表）。compose 原样内联进有效权限 rules；
# 产品档位若要改写 action，由上层 overlay，Engine 判定只认 action。
# severity 仅作标签，供后续产品表重映射。
#
# 包内默认：CRITICAL → deny，HIGH → ask。

rules:
  - id: shell_fs_recursive_or_forced_delete
    description: "递归、强制或批量删除，可能造成数据破坏"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(?:^|[\s;&|()])(?:(?:rm\s+(?=[^;&|]*(?:/[^;&|\s]*|\*|~[^;&|\s]*|\$HOME[^;&|\s]*|\.{1,2}(?:/[^;&|\s]*)?))(?=[^;&|]*(?:-[A-Za-z]*[rR][A-Za-z]*[fF]|-[A-Za-z]*[fF][A-Za-z]*[rR]|--recursive\b|--force\b|-[rR]\b[^;&|]*-[fF]\b|-[fF]\b[^;&|]*-[rR]\b))|(?:rm\s+(?:/\*|~/|\$HOME/|\.{1,2}/))|(?:find\s+[^;&|]*\s-delete\b)|(?:shred\b(?=[^;&|]*(?:/[^;&|\s]*|\*|~[^;&|\s]*|\$HOME[^;&|\s]*|(?:^|[\s])\.{1,2}(?:/[^;&|\s]*)?)))|(?:del\s+[^;&|]*/[fqs]+\b)|(?:(?:rd|rmdir)\s+[^;&|]*/[qf]*s[qf]*\b)))'
    severity: HIGH
    action: ask

  - id: shell_ps_recursive_or_forced_delete
    description: "PowerShell 递归或强制删除，可能造成数据破坏"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(^|[\s;&|()])(((Remove-Item|\bri\b|\berase\b|\brmdir\b|\bdel\b)\b[^\n\r;|&]*-(Recurse|Force|R|F)\b)|(\brm\b[^\n\r;|&]*-(Recurse|Force)\b))'
    severity: HIGH
    action: ask

  - id: shell_registry_delete
    description: "删除 Windows 注册表键（reg delete 或 Remove-Item 注册表驱动器）"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(?:^|[\s;&|()])(?:(?:reg\s+delete\b)|(?:(?:Remove-Item|Remove-ItemProperty|\bri\b)\b(?:\s[^\n\r;|&]*?)+?(?:HK(?:LM|CU|CR|U|CC):|Registry::)))'
    severity: CRITICAL
    action: deny

  - id: shell_disk_partition_or_raw_device_write
    description: "格式化、分区或直接写入块设备，可能破坏磁盘和文件系统"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(?:^|[\s;&|()])(?:(?:mkfs(?:\.[A-Za-z0-9_]+)?|mke2fs|diskpart|Format-Volume|Clear-Disk)\b|(?:fdisk\b(?!\s+(?:-l\b|--list\b)))|(?:parted\b(?!\s+(?:-l\b|--list\b)))|(?:format(?:\.com)?\s+(?:/[A-Za-z]+\s+)*[A-Za-z]:)|(?:dd\b[^;&|]*?(?:\bof\s*=\/dev\/|\\\\\.\\PhysicalDrive))|(?:>>?\s*\/dev\/(?:sd[a-z][0-9]*|vd[a-z][0-9]*|xvd[a-z][0-9]*|nvme[0-9]+n[0-9]+(?:p[0-9]+)?|disk[0-9]+)))'
    severity: CRITICAL
    action: deny

  - id: shell_download_and_execute
    description: "从网络下载内容后直接交给 shell、PowerShell 或动态执行器执行"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(^|[\s;&|()])(((curl|wget|fetch|ftp)\b[^;&]*\|\s*(?:(?:sudo|doas)\s+)?(bash|sh|zsh|dash|ash|source|pwsh|powershell)\b)|(iwr|irm|Invoke-WebRequest|Invoke-RestMethod)\b[^;&|]*\|\s*(iex|Invoke-Expression)\b|((bash|sh|zsh|pwsh|powershell)\b[^;&|]*<\s*<\s*\(?\s*(curl|wget)\b))'
    severity: HIGH
    action: ask

  - id: shell_obfuscated_or_dynamic_execution
    description: "编码载荷、解码后执行、eval/iex 或内联解释器执行，命令难以审计"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(^|[\s;&|()])((base64\s+(-d|--decode)\b[^;&|]*\|\s*(bash|sh|zsh|dash|ash)\b)|(certutil\s+-decode\b)|((?:powershell|pwsh)\b[^;&|]*-(?:[Ee]nc(?:oded[Cc]ommand)?|[Ee]ncoded[Cc]ommand)\b)|(\[Convert\]::FromBase64String\()|(eval\s+[`$])|(\b(iex|Invoke-Expression)\b)|((python3?|perl|ruby|node)\s+(-c|-e)\b[^;&|]*(socket|subprocess|exec|eval|child_process)))'
    severity: HIGH
    action: ask

  - id: shell_reverse_shell_or_bind_shell
    description: "反向 shell、绑定 shell 或可疑网络执行通道"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(/dev/(tcp|udp)/|(^|[\s;&|()])(nc|ncat)\b[^;&|]*\s(-e|--exec)\s|\bsocat\b[^;&|]*(EXEC:|SYSTEM:|PTY)|\bbash\s+-i\b[^;&|]*/dev/tcp/|\bpython3?\s+-[ce]\b[^;&|]*(socket|pty\.spawn|subprocess)|\bperl\s+-[ce]\b[^;&|]*Socket)'
    severity: CRITICAL
    action: deny

  - id: shell_privilege_escalation
    description: "通过 sudo、su、doas、pkexec、runas 或管理员启动方式提升权限"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(^|[\s;&|()])((sudo|doas|pkexec)\s+|su\s+(-|root|\w)|runas\b|Start-Process\b[^;&|]*-Verb\s+RunAs\b|psexec\b|schtasks\b[^;&|]*/ru\s+SYSTEM\b)'
    severity: HIGH
    action: ask

  - id: shell_data_exfiltration
    description: "通过curl、wget、PowerShell等工具外发本地文件"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(?:^|[\s;&|\n()])(?:curl\b[^;&|\n]*?(?:--upload-file\b|(?:--data(?:-binary|-raw|-urlencode)?|-d)(?:\s+|=)?@|(?:-F|--form)(?:\s+|=)(?:@[^\s;&|\n]+|[^\s;&|\n]+=@)|-T\s+\S+)|wget\b[^;&|\n]*?--post-file\b|(?:Invoke-WebRequest|iwr|Invoke-RestMethod|irm)\b[^;&|\n]*?-InFile\b)'
    severity: HIGH
    action: ask

  - id: shell_remote_execution_or_lateral_movement
    description: "远程会话、远程进程创建或横向移动命令"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(^|[\s;&|()])((Invoke-Command|Enter-PSSession|New-PSSession)\b|winrs\b|wmic\b[^;&|]*process\s+call\s+create|psexec\b|ssh\b[^;&|]*\s\S+\s+["''][^"'']+["''])'
    severity: HIGH
    action: ask

  - id: shell_fork_bomb_or_resource_abuse
    description: "fork bomb、解除进程限制或批量终止关键进程"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(:\s*\(\s*\)\s*\{\s*:\s*\|\s*:\s*&\s*\}\s*;\s*:|(^|[\s;&|()])kill\s+-9\s+(-1|1)\b|(^|[\s;&|()])ulimit\s+-u\s+unlimited\b)'
    severity: CRITICAL
    action: deny

  - id: shell_system_shutdown_or_reboot
    description: "关机、重启或切换到关机/重启运行级别，属于明显破坏系统可用性的行为"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(?:^|&&|\|\||[;\n]|&)\s*(?:(?:(?:sudo|doas)\s+)?(?:shutdown|reboot|halt|poweroff)\b(?!\s+--help)|systemctl\s+(?:reboot|poweroff|halt)|(?:Stop-Computer|Restart-Computer)\b|(?:init|telinit)\s+(0|6)\b)'
    severity: CRITICAL
    action: deny

  - id: shell_chmod_world_writable
    description: "把文件或目录权限放宽为全局可写"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(?:^|[\s;&|()])chmod\s+(?:(?:-R|--recursive)\s+)?(?:0?[0-7]{2}[2367]\b|[0-7]{3}[2367]\b|a\+rwx\b|[ao]\+[a-z]*w[a-z]*)'
    severity: HIGH
    action: ask

  - id: shell_ld_preload_hijack
    description: "通过 LD_PRELOAD / DYLD_INSERT_LIBRARIES 劫持动态链接"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(^|[\s;&|()])((LD_PRELOAD|DYLD_INSERT_LIBRARIES)\s*=)'
    severity: HIGH
    action: ask

  - id: shell_clear_audit_history
    description: "清除 shell 历史或审计痕迹"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(^|[\s;&|()])((history\s+-c\b)|(HISTFILE\s*=\s*/dev/null)|((rm|shred)\b[^;&|]*\.(bash_history|zsh_history|python_history)\b)|Set-PSReadLineOption\b[^;&|]*HistorySaveStyle\b[^;&|]*SaveNothing)'
    severity: HIGH
    action: ask

  - id: shell_disable_firewall
    description: "关闭或清空防火墙规则"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(^|[\s;&|()])((ufw\b[^;&|]*\bdisable\b)|(iptables\s+(?:-t\s+\S+\s+)?(?:-F|--flush)\b)|(firewall-cmd\b[^;&|]*--set-default-zone=trusted)|(Set-NetFirewallProfile\b[^;&|]*-Enabled\s+False\b))'
    severity: HIGH
    action: ask

  - id: shell_docker_privileged
    description: "以过宽权限启动容器（privileged / SYS_ADMIN / pid=host）"
    tools: [shell]
    match_type: command
    pattern: 're:(?i)(^|[\s;&|()])docker\s+run\b[^;&|]*(--privileged\b|--cap-add(=|\s+)SYS_ADMIN\b|--pid(=|\s+)host\b)'
    severity: HIGH
    action: ask

# 路径内置底线（file_guard）：默认 action 写入三轴；compose 在 file_guard.enabled 时注入。
sensitive_paths:
  - id: home_ssh
    path: "~/.ssh/**"
    match: glob
    severity: CRITICAL
    action: deny
  - id: any_ssh
    path: "**/.ssh/**"
    match: glob
    severity: CRITICAL
    action: deny
  - id: any_env
    path: "**/.env"
    match: glob
    severity: CRITICAL
    action: deny
  - id: any_env_ext
    path: "**/.env.*"
    match: glob
    severity: CRITICAL
    action: deny
  - id: any_id_rsa
    path: "**/id_rsa"
    match: glob
    severity: CRITICAL
    action: deny
  - id: any_id_rsa_ext
    path: "**/id_rsa.*"
    match: glob
    severity: CRITICAL
    action: deny
  - id: any_id_ed25519
    path: "**/id_ed25519"
    match: glob
    severity: CRITICAL
    action: deny
  - id: any_id_ed25519_ext
    path: "**/id_ed25519.*"
    match: glob
    severity: CRITICAL
    action: deny
  - id: any_pem
    path: "**/*.pem"
    match: glob
    severity: CRITICAL
    action: deny
  - id: any_pfx
    path: "**/*.pfx"
    match: glob
    severity: CRITICAL
    action: deny
  - id: any_key
    path: "**/*.key"
    match: glob
    severity: CRITICAL
    action: deny
  - id: home_aws
    path: "~/.aws/**"
    match: glob
    severity: HIGH
    action: ask
  - id: home_gnupg
    path: "~/.gnupg/**"
    match: glob
    severity: HIGH
    action: ask
  - id: home_kube
    path: "~/.kube/**"
    match: glob
    severity: HIGH
    action: ask
  - id: home_docker_config
    path: "~/.docker/config.json"
    match: glob
    severity: HIGH
    action: ask
  - id: home_netrc
    path: "~/.netrc"
    match: glob
    severity: HIGH
    action: ask
  - id: home_npmrc
    path: "~/.npmrc"
    match: glob
    severity: HIGH
    action: ask
  - id: home_gcloud
    path: "~/.config/gcloud/**"
    match: glob
    severity: HIGH
    action: ask

# 抓取内置底线（net_guard）：compose / ingest 在 net_guard.enabled 时注入。
# YAML overlay 不得把 builtin URL 放宽为 allow。仅 allow|deny。
net_urls:
  "169.254.169.254": deny
  "metadata.google.internal": deny
  "localhost": deny
  "127.0.0.1": deny

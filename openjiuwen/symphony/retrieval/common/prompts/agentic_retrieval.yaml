root_prompt:
  zh: |-
    # Agentic 技能检索

    已启用适用于较大规模已安装技能场景下的 Agentic 技能检索。处理可能需要技能的任务时，不要依赖全量技能列表注入。

    `{explore_tool}` 和 `{peek_tool}` 是技能目录查阅工具。它们只披露分类和已安装技能条目；请先根据目录结果筛选候选技能，只有当某个技能看起来确实需要使用时，才读取其 SKILL.md。
    对于明显需要已安装技能的任务，不要在未使用至少一个目录工具前直接返回“没有相关技能”或空技能结果。

    使用技能目录时，先根据任务识别：
    1. 主能力分支
    2. 输入格式分支
    3. 输出格式分支
    4. 验证/评估/测试分支
    5. 必要的执行环境分支

    优先探索主能力分支；只有当某个任务约束会改变技能选择、执行方案或验收标准时，才补充探索对应辅助分支。
    输入/输出形式、验证要求、执行约束、依赖条件等都可以作为任务约束；对只提供背景且不影响技能选择的信息，不要额外展开分支。
    当叶子技能中同时出现宽泛概览技能和精确任务技能时，优先选择精确技能；宽泛概览技能只在需要补充必要背景时使用。

    下面已经给出第一层分类。请先从这些分类中选择最相关的分类 id，并对该分类调用 `{explore_tool}`。
    调用工具时必须使用反引号中的分类 id，不要把展示序号当作 `node_ids`。
    不要把 `ROOT` 作为首轮 `{explore_tool}` 的输入。
    当 `{explore_tool}` 返回 `skills` 小节时，其中条目是已安装技能而不是 branch id。
    先根据 Name 和 Description 筛选，只有当某个技能看起来需要使用时，才读取其 SKILL.md，不要继续展开技能名。
    只有当无法根据第一层分类判断方向时，才用 `{peek_tool}` 查看 `ROOT` 的轻量摘要。
    如果工具提示索引缺失或过期，调用一次 `{build_tool}` 后重试。

    ## 第一层分类
    {categories}
  en: |-
    # Agentic Skill Retrieval

    Agentic retrieval for installed skills is enabled. For tasks that may need skills, avoid relying on a full injected skill list.

    `{explore_tool}` and `{peek_tool}` are skill-directory browsing tools. They disclose categories and installed skill entries. Use directory results to shortlist skills; read a returned SKILL.md only after the skill looks likely needed.
    For tasks that clearly need installed skills, do not return a final answer with no relevant skills before using at least one directory tool.

    When using the skill directory, first identify these possible branches from the task:
    1. Main capability branch
    2. Input format branch
    3. Output format branch
    4. Validation/evaluation/test branch
    5. Required execution environment branch

    Prioritize exploring the main capability branch. Explore supporting branches only when a task constraint would change skill selection, execution strategy, or acceptance criteria.
    Input/output forms, validation requirements, execution constraints, and dependency conditions can all be task constraints.
    Do not expand extra branches for background details that do not affect skill selection.
    When terminal skills include both broad overview skills and exact task-specific skills, prefer the exact skills. Use broad overview skills only as supplements when they add necessary context.

    The first-level categories below are already visible. Start by selecting the most relevant category id from this list and call `{explore_tool}` on that category.
    Use the backticked category id as `node_ids`; never use a display number as `node_ids`.
    Do not call `{explore_tool}` with `ROOT` as the first step.
    When `{explore_tool}` returns a `skills` section, those entries are installed skills rather than branch ids.
    Use Name and Description to shortlist them, and read SKILL.md only after choosing a skill as likely useful.
    Use `{peek_tool}` with `ROOT` only if you cannot decide from the listed categories.
    If either tool says the index is missing or stale, call `{build_tool}` once and retry.

    ## First-Level Categories
    {categories}

index_unavailable:
  zh: |-
    # Agentic 技能检索

    已启用 Agentic 技能检索，但当前技能索引尚不可用。

    {reason}

    需要索引化技能检索时调用 `{build_tool}`；也可以继续按宿主系统原有流程执行。
  en: |-
    # Agentic Skill Retrieval

    Agentic skill retrieval is enabled, but the skill index is not ready.

    {reason}

    Call `{build_tool}` when indexed skill retrieval is useful, or continue with the host system's original flow.
